services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starlight_app
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    command: >
      bash -lc "if [ ! -f /var/www/html/vendor/autoload.php ]; then composer install --no-interaction; fi; apache2-foreground"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-development}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - starlight_network

  db:
    image: mariadb:11
    container_name: starlight_db
    restart: unless-stopped
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - starlight_network

  redis:
    image: redis:7-alpine
    container_name: starlight_redis
    restart: unless-stopped
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - starlight_network

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starlight_cron
    restart: unless-stopped
    command: >
      bash -c "while true; do
        if [ ! -f /var/www/html/vendor/autoload.php ]; then composer install --no-interaction; fi;
        php /var/www/html/cron/process_turn.php >> /var/www/html/logs/cron.log 2>&1;
        sleep 300;
      done"
    volumes:
      - .:/var/www/html
      - ./logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - starlight_network

  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: starlight_docs
    restart: unless-stopped
    ports:
      - "${DOCKER_DOCS_PORT:-8000}:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: serve --dev-addr=0.0.0.0:8000
    networks:
      - starlight_network
    environment:
      - WATCHDOG_FALLBACK_POLL=500 # forces polling file watcher

  frontend:
    image: node:20-alpine
    container_name: starlight_frontend
    restart: unless-stopped
    working_dir: /workspace/frontend
    # TODO(next-iteration, PR review 3911538619): switch to npm ci and cache
    # node_modules (volume or image layer) to avoid reinstalling on each restart.
    command: >
      sh -c "npm install && npm run build -- --watch"
    volumes:
      - .:/workspace
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - starlight_network

networks:
  starlight_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
